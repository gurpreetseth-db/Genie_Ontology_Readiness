version: 2
updates:
  # Python backend (app/requirements.txt).
  - package-ecosystem: pip
    directory: /app
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"

  # React/Vite frontend.
  - package-ecosystem: npm
    directory: /app/frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # Tailwind v4 drops the PostCSS plugin and changes defaults; migrating
      # postcss.config.js / tailwind.config.js / index.css is a deliberate job.
      - dependency-name: tailwindcss
        update-types: ["version-update:semver-major"]
